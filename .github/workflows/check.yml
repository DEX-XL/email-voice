name: Check release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify single-file release
        run: python tools/build.py --check
      - name: Run packaging and privacy checks
        run: python -m unittest discover -s tests -v
